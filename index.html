<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TKB Converter - Chuyển Đổi Thời Khóa Biểu</title>
    <link rel="stylesheet" href="style.css?v=2.1">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 TKB Converter</h1>
            <p class="subtitle">Hệ Thống Lọc & Chuyển Đổi Thời Khóa Biểu Cá Nhân</p>
        </header>

        <main>
            <!-- Khu vực Tải File -->
            <section class="section">
                <h2>1️⃣ Tải File Excel</h2>
                <div class="upload-area" id="uploadArea">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p class="upload-text">Kéo file Excel (.xlsx) vào đây hoặc <span class="file-label">chọn file</span></p>
                    <input type="file" id="fileInput" 
                           accept=".xlsx, .xls, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" 
                           style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; z-index: -1;">
                </div>

                <!-- Ô nhập Direct Link -->
                <div class="url-input-container">
                    <input type="url" id="fileUrlInput" placeholder="Hoặc dán Direct Link file Excel (.xlsx) tại đây...">
                    <button id="loadUrlBtn" type="button" class="btn btn-primary">
                        🔗 Tải từ Link
                    </button>
                </div>

                <div id="fileStatus" class="file-status"></div>
            </section>

            <!-- Khu vực Debug -->
            <section class="section debug-section">
                <button id="toggleDebugBtn" type="button" class="btn btn-debug">
                    🐛 Enable Debug
                </button>
                <div id="debugConsole"></div>
            </section>

            <!-- Khu vực Chọn Lớp -->
            <section class="section" id="classSection" style="display: none;">
                <h2>2️⃣ Chọn Lớp</h2>
                <div class="class-selector">
                    <label for="classDropdown">Chọn Lớp:</label>
                    <select id="classDropdown">
                        <option value="">-- Vui lòng chọn lớp --</option>
                    </select>
                </div>
                <div id="classStatus" class="status-message"></div>
            </section>

            <!-- Khu vực Xem Trước -->
            <section class="section" id="previewSection" style="display: none;">
                <h2>3️⃣ Xem Trước Bảng TKB</h2>
                <div id="previewTable" class="preview-container"></div>
            </section>

            <!-- Khu vực Xuất File -->
            <section class="section" id="exportSection" style="display: none;">
                <h2>4️⃣ Xuất File Excel</h2>
                <button id="exportBtn" class="btn btn-primary">
                    📊 Tải File Excel TKB
                </button>
                <div id="exportStatus" class="status-message"></div>
            </section>
        </main>

        <footer>
            <p>Made by: TimelessPrime | Bio Links : guns.lol/timeless.thebest</p>
        </footer>
    </div>

    <!-- Nhúng thư viện Excel từ CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="app.js?v=3.0"></script>
</body>
</html>
